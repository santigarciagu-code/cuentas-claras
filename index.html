<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cuentas Claras</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png?v=3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cuentas">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#6c4cf5">
<style>
:root{--bg:#f4f3fa;--card:#fff;--ink:#17152b;--mut:#6f6b88;--line:#e6e3f2;--acc:#6c4cf5;--acc2:#efeaff;--ok:#119c63;--okb:#e3f7ee;--bad:#e5484d;--badb:#fdecec;--warn:#b7791f;--warnb:#fdf3e1;
  --grad:linear-gradient(135deg,#5b3df0 0%,#8f45f2 50%,#e0559a 100%);--sh:0 1px 2px rgba(23,21,43,.04),0 6px 24px rgba(23,21,43,.06)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0d18;--card:#191726;--ink:#eeecf8;--mut:#9b97b5;--line:#2a2740;--acc:#9b85ff;--acc2:#262044;--ok:#3ed598;--okb:#13291f;--bad:#ff7b7f;--badb:#341a1c;--warn:#f0b35a;--warnb:#33281a;--sh:none}}
:root[data-theme="dark"]{--bg:#0e0d18;--card:#191726;--ink:#eeecf8;--mut:#9b97b5;--line:#2a2740;--acc:#9b85ff;--acc2:#262044;--ok:#3ed598;--okb:#13291f;--bad:#ff7b7f;--badb:#341a1c;--warn:#f0b35a;--warnb:#33281a;--sh:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior-y:none}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;padding:calc(env(safe-area-inset-top) + 8px) 16px calc(env(safe-area-inset-bottom) + 104px);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
.hide{display:none!important}
h1{font-size:30px;letter-spacing:-.02em;margin:10px 0 2px;font-weight:800}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:24px 4px 8px;font-weight:700}
.sub{color:var(--mut);font-size:13px}
.card{background:var(--card);border-radius:20px;padding:16px;margin:10px 0;box-shadow:var(--sh);border:1px solid var(--line)}
.num{font-variant-numeric:tabular-nums}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ver{font-size:11px;font-weight:600;color:var(--mut);border:1px solid var(--line);border-radius:999px;padding:2px 8px}
/* hero */
.hero{background:var(--grad);color:#fff;border-radius:26px;padding:18px 18px 16px;margin:12px 0;box-shadow:0 12px 32px rgba(108,76,245,.35);position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:190px;height:190px;border-radius:50%;background:rgba(255,255,255,.1)}
.hero .lbl{font-size:13px;opacity:.85;font-weight:600}
.hero .big{font-size:40px;font-weight:800;letter-spacing:-.03em;margin:2px 0 10px}
.hero .who{display:flex;gap:10px;position:relative;z-index:1}
.hero .who div{flex:1;background:rgba(255,255,255,.16);border-radius:16px;padding:10px 12px;backdrop-filter:blur(6px)}
.hero .who b{display:block;font-size:21px;letter-spacing:-.02em}
.hero .who span{font-size:12px;opacity:.9}
.mnav{display:flex;align-items:center;gap:6px;position:relative;z-index:1}
.mnav button{border:0;background:rgba(255,255,255,.18);color:#fff;width:32px;height:32px;border-radius:50%;font-size:16px}
.mnav span{font-weight:700;font-size:15px;min-width:118px;text-align:center;text-transform:capitalize}
.extra{font-size:12px;margin-top:10px;opacity:.95;position:relative;z-index:1;line-height:1.5}
/* persona */
.av{width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:15px;flex:none}
.pc .hd{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.pc .hd b{font-size:17px}
.kv{display:flex;justify-content:space-between;padding:7px 0;font-size:15px;border-top:1px solid var(--line)}
.kv:first-of-type{border-top:0}
.kv span{color:var(--mut)}
.kv.tot{font-weight:800;font-size:17px}
.kv.tot span{color:var(--ink)}
.stack{display:flex;height:12px;border-radius:8px;overflow:hidden;background:var(--line);margin:12px 0 6px}
.stack i{display:block;height:100%}
.leg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--mut)}
.leg i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* listas */
.seg{display:flex;background:var(--line);border-radius:14px;padding:3px;gap:3px;margin:12px 0}
.seg button{flex:1;border:0;background:none;border-radius:11px;padding:9px 6px;font-weight:600;font-size:14px;color:var(--mut)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.grp{background:var(--card);border-radius:20px;margin:10px 0;border:1px solid var(--line);box-shadow:var(--sh);overflow:hidden}
.grp .gh{display:flex;align-items:center;gap:10px;padding:12px 14px 8px;font-weight:700}
.grp .gh small{margin-left:auto;color:var(--mut);font-weight:600}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid var(--line);width:100%;border-left:0;border-right:0;border-bottom:0;background:none;text-align:left}
.row:active{background:var(--acc2)}
.ic{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t small{display:block;color:var(--mut);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .m{text-align:right}
.row .m b{display:block;font-size:15px}
.row .m small{color:var(--mut);font-size:11px}
.off{opacity:.45}
.tag{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:999px;margin-right:4px;vertical-align:1px}
.search{width:100%;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:11px 14px;font:inherit;font-size:16px;color:var(--ink)}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
.empty b{display:block;font-size:40px;margin-bottom:6px}
/* nav */
nav{position:fixed;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom) + 10px);display:flex;align-items:center;background:color-mix(in srgb,var(--card) 82%,transparent);backdrop-filter:blur(18px) saturate(1.6);-webkit-backdrop-filter:blur(18px) saturate(1.6);border:1px solid var(--line);border-radius:24px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.12);z-index:20}
nav button{flex:1;border:0;background:none;color:var(--mut);font-size:10.5px;font-weight:600;padding:5px 0;border-radius:16px}
nav button b{display:block;font-size:21px;line-height:1.2;font-weight:400;filter:grayscale(.6);opacity:.75}
nav button.on{color:var(--acc)}
nav button.on b{filter:none;opacity:1}
nav .fab{flex:none;width:56px;height:56px;border-radius:18px;background:var(--grad);color:#fff;font-size:30px;font-weight:300;margin:0 4px;box-shadow:0 6px 18px rgba(108,76,245,.45);line-height:1}
/* sheet */
.ov{position:fixed;inset:0;background:rgba(10,8,25,.45);z-index:40;opacity:0;transition:opacity .2s;pointer-events:none}
.ov.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--bg);border-radius:26px 26px 0 0;z-index:41;padding:8px 16px calc(env(safe-area-inset-bottom) + 20px);transform:translateY(105%);visibility:hidden;transition:transform .28s cubic-bezier(.2,.9,.3,1),visibility 0s .28s;-webkit-overflow-scrolling:touch}
.sheet.on{transform:none;visibility:visible;transition:transform .28s cubic-bezier(.2,.9,.3,1)}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 8px}
.sh-top{display:flex;align-items:center;justify-content:space-between;position:sticky;top:-8px;background:var(--bg);padding:6px 0 8px;z-index:2}
.sh-top b{font-size:17px}
.link{border:0;background:none;color:var(--acc);font-weight:600;font-size:16px;padding:6px 2px}
label.l{display:block;font-size:13px;color:var(--mut);margin:16px 4px 7px;font-weight:600}
input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;-webkit-appearance:none;appearance:none}
input:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:-1px}
.amt{position:relative}
.amt input{font-size:38px;font-weight:800;letter-spacing:-.02em;padding:14px 50px 14px 16px;text-align:left}
.amt span{position:absolute;right:18px;top:50%;transform:translateY(-50%);font-size:28px;color:var(--mut);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:9px 14px;font-size:14px;font-weight:600}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.catg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.catg button{border:1.5px solid var(--line);background:var(--card);border-radius:16px;padding:10px 2px 8px;font-size:11.5px;font-weight:600;line-height:1.15;overflow-wrap:anywhere}
.catg button em{display:block;font-style:normal;font-size:24px;margin-bottom:3px}
.catg button.on{border-color:var(--acc);background:var(--acc2);box-shadow:inset 0 0 0 1px var(--acc)}
.split{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.split .nm{display:flex;justify-content:space-between;font-weight:700;margin-bottom:10px}
input[type=range]{padding:0;border:0;height:28px;background:none}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:linear-gradient(90deg,var(--ca) 0 var(--p),var(--cb) var(--p) 100%)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;border:1px solid rgba(0,0,0,.1);box-shadow:0 2px 8px rgba(0,0,0,.25);margin-top:-10px}
.btn{display:block;width:100%;border:0;background:var(--grad);color:#fff;font-weight:700;font-size:17px;border-radius:16px;padding:15px;margin-top:18px}
.btn.sec{background:var(--card);color:var(--acc);border:1.5px solid var(--line)}
.btn.del{background:var(--badb);color:var(--bad)}
.btn:disabled{opacity:.4}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.bar{padding:11px 14px;border-radius:14px;font-size:14px;margin:10px 0;font-weight:500}
.bar.ok{background:var(--okb);color:var(--ok)}.bar.warn{background:var(--warnb);color:var(--warn)}.bar.err{background:var(--badb);color:var(--bad)}
.bar button{border:0;background:none;font-weight:700;color:inherit;text-decoration:underline;padding:0}
.calc{font-size:13px;color:var(--mut);background:var(--acc2);border-radius:12px;padding:10px 12px;margin-top:10px}
.calc b{color:var(--ink)}
.toggle{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:10px}
.sw{width:50px;height:30px;border-radius:15px;background:var(--line);border:0;position:relative;transition:.2s}
.sw:after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:.2s}
.sw.on{background:var(--ok)}.sw.on:after{left:23px}
.colors{display:flex;gap:10px;flex-wrap:wrap}
.colors button{width:34px;height:34px;border-radius:50%;border:3px solid var(--bg);box-shadow:0 0 0 1.5px var(--line)}
.colors button.on{box-shadow:0 0 0 2.5px var(--ink)}
.emo{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.emo button{border:0;background:var(--card);border-radius:10px;padding:6px 0;font-size:22px}
.emo button.on{background:var(--acc2);box-shadow:inset 0 0 0 2px var(--acc)}
/* informes */
.donut{display:flex;align-items:center;gap:16px}
.donut svg{width:150px;height:150px;flex:none;transform:rotate(-90deg)}
.donut .lg{flex:1;min-width:0;font-size:13px}
.donut .lg div{display:flex;align-items:center;gap:6px;padding:3px 0}
.donut .lg span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dc{position:relative}
.dc .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.dc .c b{font-size:19px;letter-spacing:-.02em}.dc .c small{font-size:11px;color:var(--mut)}
.hb{display:grid;grid-template-columns:110px 1fr 70px;align-items:center;gap:8px;margin:9px 0;font-size:14px}
.hb span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb i{display:block;height:12px;background:var(--line);border-radius:6px;overflow:hidden}
.hb u{display:block;height:100%;border-radius:6px}
.hb b{text-align:right;font-size:13px}
.vb{display:flex;align-items:flex-end;gap:8px;height:150px;padding-top:10px}
.vb div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;color:var(--mut)}
.vb u{display:block;width:100%;border-radius:8px 8px 4px 4px;background:var(--grad);min-height:3px}
.vb small{font-size:10px;color:var(--ink);font-weight:700;margin-bottom:3px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--sh)}
.tile b{display:block;font-size:22px;letter-spacing:-.02em}
.tile span{font-size:12px;color:var(--mut)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 96px);transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;transition:.25s;z-index:60;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%)}
.modal{position:fixed;left:50%;top:50%;width:min(340px,calc(100vw - 40px));transform:translate(-50%,-46%) scale(.96);background:var(--card);border-radius:24px;padding:24px 20px 18px;z-index:50;text-align:center;opacity:0;pointer-events:none;transition:.22s;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.modal .mi{width:60px;height:60px;border-radius:18px;background:var(--grad);color:#fff;font-size:28px;display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
.modal b.t{display:block;font-size:19px;font-weight:800;letter-spacing:-.01em}
.modal p{color:var(--mut);font-size:14px;margin:6px 0 4px;line-height:1.45}
.modal .btn{margin-top:14px}.modal .btn.sec{margin-top:8px}
.ov2{position:fixed;inset:0;background:rgba(10,8,25,.45);z-index:49;opacity:0;pointer-events:none;transition:opacity .2s}
.ov2.on{opacity:1;pointer-events:auto}
.sett .row{padding:13px 14px}
.share{display:flex;align-items:center;gap:12px}
.share .ic{width:44px;height:44px;border-radius:14px;background:var(--acc2);font-size:22px}
.share .t{flex:1;min-width:0}.share .t b{display:block}.share .t small{color:var(--mut);font-size:12px}
.sbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.sbtns .btn{margin:0;padding:13px 8px;font-size:15px}
</style>
</head>
<body>
<div id="v-home"></div>
<div id="v-gastos" class="hide"></div>
<div id="v-rep" class="hide"></div>
<div id="v-cfg" class="hide"></div>

<nav>
  <button data-v="home" class="on"><b>🏠</b>Inicio</button>
  <button data-v="gastos"><b>🧾</b>Gastos</button>
  <button class="fab" data-a="new" aria-label="Nuevo gasto">+</button>
  <button data-v="rep"><b>📊</b>Informes</button>
  <button data-v="cfg"><b>⚙️</b>Ajustes</button>
</nav>
<div class="ov" id="ov" data-a="close"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<div class="ov2" id="ov2"></div>
<div class="modal" id="modal" role="dialog" aria-modal="true"></div>

<script>
'use strict';
var VERSION='v11';
var APP='cuentas-claras';

// ---------- utilidades ----------
function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
var FMT=new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR',minimumFractionDigits:2,maximumFractionDigits:2});
var FMT0=new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR',maximumFractionDigits:0});
function eur(n){return FMT.format(Math.round((+n||0)*100)/100)}
function eur0(n){return FMT0.format(+n||0)}
function num(v){if(typeof v==='number')return v; v=String(v||'').trim().replace(/\s|€/g,''); if(v.indexOf(',')>=0)v=v.replace(/\./g,'').replace(',','.'); var n=parseFloat(v); return isFinite(n)?n:0}
function r2(n){return Math.round(n*100)/100}
function uid(){return (crypto&&crypto.randomUUID)?crypto.randomUUID():'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,9)}
function now(){return Date.now()}
var LS={get:function(k,d){try{var v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
var MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
var MES3=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function ymOf(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function today(){var d=new Date();return ymOf(d)+'-'+String(d.getDate()).padStart(2,'0')}
function ymAdd(ym,k){var p=ym.split('-');var d=new Date(+p[0],+p[1]-1+k,1);return ymOf(d)}
function ymName(ym){var p=ym.split('-');return MESES[+p[1]-1]+' '+p[0]}
function ymShort(ym){var p=ym.split('-');return MES3[+p[1]-1]}
function fechaBonita(iso){var p=String(iso||'').split('-');return p.length===3?(+p[2])+' '+MES3[+p[1]-1]:iso}
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(function(){t.classList.remove('on')},1900)}
function haptic(){try{navigator.vibrate&&navigator.vibrate(8)}catch(e){}}

// ---------- datos iniciales (app vacía: solo categorías de ejemplo) ----------
var PERIODOS=[[1,'Mensual'],[2,'Cada 2 meses'],[3,'Trimestral'],[6,'Semestral'],[12,'Anual']];
var COLORS=['#3b82f6','#e0559a','#8b5cf6','#10b981','#f59e0b','#ef4444','#06b6d4','#64748b','#84cc16','#f97316'];
var EMOJIS=['🏠','💡','💧','🔥','📶','🛡️','🚗','🏍️','⛽','🛒','🍽️','📺','🎵','☁️','❤️','💊','🐾','👶','🎓','✈️','🎁','👕','💇','🏋️','🧾','🏦','💳','🔧','🎉','📦','🧸','✨'];
function seed(){
  var u=-1; // u=-1: cualquier dato recibido de la pareja tiene prioridad sobre estos valores iniciales
  var P=[
    {id:'p1',nombre:'Persona 1',color:'#3b82f6',orden:1,u:u},
    {id:'p2',nombre:'Persona 2',color:'#e0559a',orden:2,u:u}
  ];
  var C=[
    {id:'c-hogar',nombre:'Hogar',emoji:'🏠',color:'#8b5cf6',reparto:50},
    {id:'c-sumin',nombre:'Suministros',emoji:'💡',color:'#f59e0b',reparto:50},
    {id:'c-seg',nombre:'Seguros',emoji:'🛡️',color:'#10b981',reparto:50},
    {id:'c-trans',nombre:'Coche y moto',emoji:'🚗',color:'#ef4444',reparto:50},
    {id:'c-subs',nombre:'Suscripciones',emoji:'📺',color:'#06b6d4',reparto:50},
    {id:'c-super',nombre:'Súper y comida',emoji:'🛒',color:'#84cc16',reparto:50},
    {id:'c-ocio',nombre:'Ocio y viajes',emoji:'✈️',color:'#f97316',reparto:50},
    {id:'c-otros',nombre:'Otros',emoji:'📦',color:'#64748b',reparto:50}

function dbSet(k,v){return new Promise(function(res,rej){var t=DB.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=function(){res()};t.onerror=function(){rej(t.error)}})}

function alive(a){return a.filter(function(x){return !x.del})}
function pers(){return alive(S.personas).sort(function(a,b){return (a.orden||0)-(b.orden||0)}).slice(0,2)}
function P(id){return S.personas.find(function(p){return p.id===id})}
function cats(){return alive(S.categorias).sort(function(a,b){return (a.orden||0)-(b.orden||0)})}
function C(id){return S.categorias.find(function(c){return c.id===id})||{nombre:'Sin categoría',emoji:'🧾',color:'#64748b',reparto:50}}
function fijos(){return alive(S.gastos).filter(function(g){return g.tipo==='fijo'})}
function puntuales(ym){return alive(S.gastos).filter(function(g){return g.tipo==='puntual'&&(!ym||String(g.fecha).slice(0,7)===ym)})}
function comun(){return 'la cuenta común'}
function mensual(g){if(g.tipo!=='fijo'||g.activo===false)return 0; return (+g.importe||0)/Math.max(1,+g.periodo||1)}
function share(g,pid){
  var ps=pers(); if(g.titular==='comun'){var r=(g.reparto==null?50:+g.reparto)/100; return pid===ps[0].id?r:(1-r)}
  return g.titular===pid?1:0;
}
// Cada persona ingresa en la cuenta común: su parte de TODOS los gastos − lo que paga directamente desde su propia cuenta.
function calc(list,amountFn){
  var ps=pers(), out={total:0,enComun:0,cat:{},p:{}};
  ps.forEach(function(p){out.p[p.id]={parte:0,directo:0,aport:0,comunParte:0,propio:0}});
  list.forEach(function(g){
    var m=amountFn(g); if(!m)return;
    out.total+=m; if(g.desde==='comun')out.enComun+=m;
    out.cat[g.cat]=(out.cat[g.cat]||0)+m;
    ps.forEach(function(p){var s=share(g,p.id)*m; var o=out.p[p.id]; o.parte+=s; if(g.titular==='comun')o.comunParte+=s; else o.propio+=s; if(g.desde===p.id)o.directo+=m});
  });
  ps.forEach(function(p){var o=out.p[p.id];o.aport=o.parte-o.directo});
  return out;
}
function calcFijos(){return calc(fijos(),mensual)}
function calcPunt(ym){return calc(puntuales(ym),function(g){return +g.importe||0})}
function repTxt(g){var ps=pers(); if(g.titular!=='comun')return 'Solo '+(P(g.titular)||{}).nombre; var r=g.reparto==null?50:+g.reparto; return r===50?'Común 50/50':'Común '+r+'/'+(100-r)}
function desdeTxt(d){return d==='comun'?'cuenta común':'cuenta personal'}
function perTxt(n){n=+n||1;var f=PERIODOS.find(function(x){return x[0]===n});return f?f[1]:'Cada '+n+' meses'}

    cen.push(new Uint8Array([].concat(u32(0x02014b50),u16(20),common,u16(0),u16(0),u16(0),u32(0),u32(off))),name);

}

// celda: string, número, {v,s}, {f,s} (fórmula), {d:'AAAA-MM-DD'} o null
function xsheet(rows,widths,freeze){
  var x='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">';
  x+='<sheetViews><sheetView workbookViewId="0">'+(freeze?'<pane ySplit="'+freeze+'" topLeftCell="A'+(freeze+1)+'" activePane="bottomLeft" state="frozen"/>':'')+'</sheetView></sheetViews>';
  x+='<cols>'+widths.map(function(w,i){return '<col min="'+(i+1)+'" max="'+(i+1)+'" width="'+w+'" customWidth="1"/>'}).join('')+'</cols><sheetData>';
  rows.forEach(function(r,ri){
    x+='<row r="'+(ri+1)+'">';
    r.forEach(function(c,ci){
      if(c==null||c==='')return; var ref=colL(ci)+(ri+1), o=(typeof c==='object')?c:{v:c};
      var s=o.s?' s="'+o.s+'"':'';
      if(o.f!=null)x+='<c r="'+ref+'"'+s+'><f>'+xe(o.f)+'</f></c>';
      else if(o.d)x+='<c r="'+ref+'" s="5"><v>'+xdate(o.d)+'</v></c>';
      else if(typeof o.v==='number')x+='<c r="'+ref+'"'+s+'><v>'+(Math.round(o.v*10000)/10000)+'</v></c>';
      else x+='<c r="'+ref+'"'+s+' t="inlineStr"><is><t xml:space="preserve">'+xe(o.v)+'</t></is></c>';
    });
    x+='</row>';
  });
  return x+'</sheetData></worksheet>';
}
function xlsx(sheets){
  var f=[['[Content_Types].xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'+sheets.map(function(s,i){return '<Override PartName="/xl/worksheets/sheet'+(i+1)+'.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>'}).join('')+'</Types>'],
    ['_rels/.rels','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'],
    ['xl/workbook.xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>'+sheets.map(function(s,i){return '<sheet name="'+xe(s.name)+'" sheetId="'+(i+1)+'" r:id="rId'+(i+1)+'"/>'}).join('')+'</sheets><calcPr calcId="191029" fullCalcOnLoad="1"/></workbook>'],
    ['xl/_rels/workbook.xml.rels','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+sheets.map(function(s,i){return '<Relationship Id="rId'+(i+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet'+(i+1)+'.xml"/>'}).join('')+'<Relationship Id="rId'+(sheets.length+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>'],
    ['xl/styles.xml',XSTY]];
  sheets.forEach(function(s,i){f.push(['xl/worksheets/sheet'+(i+1)+'.xml',xsheet(s.rows,s.widths,s.freeze)])});
  return zip(f);
}
function H(a){return a.map(function(t){return {v:t,s:1}})}
function E(n){return {v:r2(n||0),s:2}}
function sumRow(label,cols,first,last,ncols){var r=[{v:label,s:3}];for(var i=1;i<ncols;i++)r.push(cols.indexOf(i)>=0?{f:'SUM('+colL(i)+first+':'+colL(i)+last+')',s:4}:{v:'',s:3});return r.map(function(c){return c.v===''?{v:' ',s:3}:c})}
function libroExcel(){
  var ps=pers(), A=ps[0], B=ps[1], nA=A.nombre, nB=B.nombre;
  var quien=function(g){return g.titular==='comun'?'Común':(P(g.titular)||{}).nombre};
  var cta=function(g){return g.desde==='comun'?'Cuenta común':(g.tipo==='fijo'?'Cuenta personal de ':'')+(P(g.desde)||{}).nombre};
  // 1. Resumen mensual
  var F=calcFijos(), ms=puntuales().map(function(g){return String(g.fecha).slice(0,7)}), hoy=ymOf(new Date());
  var desde=[hoy.slice(0,4)+'-01'].concat(ms).sort()[0], hasta=[hoy].concat(ms).sort().pop(), meses=[];
  for(var m=desde;m<=hasta;m=ymAdd(m,1))meses.push(m);
  var R=[[{v:'Cuentas Claras · resumen mensual',s:7}],['Exportado el '+new Date().toLocaleString('es-ES')],[],
    H(['Mes','Fijo '+nA,'Fijo '+nB,'Puntuales '+nA,'Puntuales '+nB,'Ingresa '+nA,'Ingresa '+nB,'Total a la cuenta común','Gasto puntual del mes'])];
  meses.forEach(function(m){var Pu=calcPunt(m), r=R.length+1;
    R.push([ymName(m).replace(/^./,function(c){return c.toUpperCase()}),E(F.p[A.id].aport),E(F.p[B.id].aport),E(Pu.p[A.id].aport),E(Pu.p[B.id].aport),{f:'B'+r+'+D'+r,s:2},{f:'C'+r+'+E'+r,s:2},{f:'F'+r+'+G'+r,s:2},E(Pu.total)])});
  R.push(sumRow('Total',[1,2,3,4,5,6,7,8],5,R.length,9));
  // 2. Gastos fijos
  var fx=fijos().slice().sort(function(a,b){return C(a.cat).orden-C(b.cat).orden||mensual(b)-mensual(a)});
  var Fx=[H(['Concepto','Categoría','De quién','% '+nA,'% '+nB,'Importe','Cada (meses)','Al mes','Al año','Parte '+nA+'/mes','Parte '+nB+'/mes','Se paga desde','Activo','Notas'])];
  fx.forEach(function(g){var r=Fx.length+1, on=g.activo!==false, sa=share(g,A.id), sb=share(g,B.id);
    Fx.push([g.concepto,C(g.cat).nombre,quien(g),{v:sa,s:6},{v:sb,s:6},E(g.importe),+g.periodo||1,on?{f:'F'+r+'/G'+r,s:2}:E(0),{f:'H'+r+'*12',s:2},{f:'H'+r+'*D'+r,s:2},{f:'H'+r+'*E'+r,s:2},cta(g),on?'Sí':'No (pausado)',g.notas||''])});
  Fx.push(sumRow('Total',[7,8,9,10],2,Fx.length,14));
  // 3. Gastos puntuales
  var pu=puntuales().slice().sort(function(a,b){return String(a.fecha).localeCompare(b.fecha)});
  var Px=[H(['Fecha','Concepto','Categoría','Importe','De quién','% '+nA,'% '+nB,'Parte '+nA,'Parte '+nB,'Pagado por','Notas'])];
  pu.forEach(function(g){var r=Px.length+1;
    Px.push([{d:g.fecha},g.concepto,C(g.cat).nombre,E(g.importe),quien(g),{v:share(g,A.id),s:6},{v:share(g,B.id),s:6},{f:'D'+r+'*F'+r,s:2},{f:'D'+r+'*G'+r,s:2},g.desde==='comun'?'Cuenta común':(P(g.desde)||{}).nombre,g.notas||''])});
  if(pu.length)Px.push(sumRow('Total',[3,7,8],2,Px.length,11)); else Px.push(['Todavía no hay gastos puntuales']);
  // 4. Por categoría
  var Cx=[H(['Categoría','Fijos al mes','Fijos al año','Puntuales (total)','Reparto por defecto '+nA])];
  cats().forEach(function(c){var r=Cx.length+1, pt=puntuales().filter(function(g){return g.cat===c.id}).reduce(function(s,g){return s+(+g.importe||0)},0);
    Cx.push([c.nombre,E(F.cat[c.id]||0),{f:'B'+r+'*12',s:2},E(pt),{v:(c.reparto==null?50:c.reparto)/100,s:6}])});
  Cx.push(sumRow('Total',[1,2,3],2,Cx.length,5));
  return xlsx([
    {name:'Resumen mensual',rows:R,widths:[18,14,14,16,16,14,14,22,20],freeze:4},
    {name:'Gastos fijos',rows:Fx,widths:[26,16,12,9,9,12,12,12,12,15,15,24,12,30],freeze:1},
    {name:'Gastos puntuales',rows:Px,widths:[12,26,16,12,12,9,9,12,12,16,30],freeze:1},
    {name:'Por categoría',rows:Cx,widths:[20,14,14,18,22],freeze:1}
  ]);
}
function exportarExcel(){
  var blob;
  try{blob=libroExcel()}catch(e){toast('No se pudo crear el Excel: '+e.message);return}
  var file=new File([blob],'cuentas-claras-'+today()+'.xlsx',{type:blob.type});
  function done(){toast('📊 Excel listo')}
  if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:'Cuentas Claras en Excel'}).then(done).catch(function(){})}
  else{var a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=file.name;document.body.appendChild(a);a.click();a.remove();done()}
}
function excelCard(){return '<div class="card"><div class="share"><span class="ic">📊</span><span class="t"><b>Exportar a Excel</b><small>4 hojas: resumen mensual, gastos fijos, puntuales y categorías. Se abre en Excel, Numbers o Google Sheets.</small></span></div><button class="btn" data-a="xlsx">Crear archivo Excel</button></div>'}
function otra(){var m=me();var o=pers().filter(function(p){return p.id!==m});return m&&o.length?o[0]:null}
function shareCard(full){
  var o=otra(), nm=o?esc(o.nombre):'tu pareja', yo=P(me());
  var sent=LS.get('cc_sent',''), recv=LS.get('cc_recv','');
  var h='<div class="card"><div class="share"><span class="ic">👫</span><span class="t"><b>Compartir con '+nm+'</b><small>'+
    (sent||recv?(sent?'Enviado: '+esc(sent):'')+(sent&&recv?' · ':'')+(recv?'Recibido: '+esc(recv):''):'Envía tus datos y '+nm+' los junta con los suyos')+'</small></span></div>'+
    '<div class="sbtns"><button class="btn" data-a="send">📤 Enviar a '+nm+'</button><button class="btn sec" data-a="recv">📥 Recibir</button></div>';
  if(full)h+='<div class="sub" style="margin-top:12px;line-height:1.5">Al enviar se abre el menú de compartir: elige WhatsApp, AirDrop o Mensajes. '+nm+' abre la app, toca <b>📥 Recibir</b> y elige el archivo. Se juntan los gastos de los dos sin duplicar nada; si los dos habéis editado el mismo gasto, gana el cambio más reciente. Los datos nunca pasan por internet salvo por la app que elijas para enviarlos.</div>'+
    '<button class="btn sec" data-a="sendtxt">📋 Copiar los datos como texto</button>';
  if(!yo&&full)h+='<div class="bar warn" style="margin-bottom:0">Elige arriba quién usa este móvil para que el envío lleve tu nombre.</div>';
  return h+'</div>';
}
function payload(){var yo=P(me());return JSON.stringify({app:APP,version:1,de:yo?yo.nombre:'',exportado:new Date().toISOString(),datos:S})}
function stampNow(){return new Date().toLocaleString('es-ES',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}
function enviarPareja(){
  var yo=P(me()), file=new File([payload()],'cuentas-claras'+(yo?'-de-'+yo.nombre.toLowerCase().replace(/[^a-z0-9áéíóúñ]+/g,'-'):'')+'-'+today()+'.json',{type:'application/json'});
  function done(){LS.set('cc_sent',stampNow());render();toast('📤 Datos enviados')}
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    navigator.share({files:[file],title:'Gastos de Cuentas Claras'}).then(done).catch(function(e){if(e&&e.name!=='AbortError')copiarTexto()});
  } else copiarTexto();
}
function copiarTexto(){
  var t=payload();
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){LS.set('cc_sent',stampNow());render();toast('📋 Copiado: pégalo en WhatsApp')}).catch(function(){toast('No se pudo copiar')})}
  else toast('Tu navegador no permite copiar');
}
function abrirRecibir(){
  var o=otra(), nm=o?esc(o.nombre):'tu pareja';
  edKind='recv';
  openSheet('<div class="sh-top"><button class="link" data-a="close">Cerrar</button><b>Recibir datos</b><span style="width:60px"></span></div>'+
    '<div class="card"><b>📎 Si te ha llegado un archivo</b><div class="sub" style="margin:4px 0 0">En WhatsApp: abre el archivo → Compartir → <b>Guardar en Archivos</b>. Con AirDrop se guarda solo en Descargas. Luego elígelo aquí:</div>'+
    '<label class="btn" style="text-align:center">Elegir archivo de '+nm+'<input type="file" id="r-file" accept="application/json,.json,text/plain" style="display:none"></label></div>'+
    '<div class="card"><b>📋 Si te ha llegado como texto</b><div class="sub" style="margin:4px 0 0">Mantén pulsado el mensaje → Copiar, y toca:</div>'+
    '<button class="btn sec" data-a="paste">Pegar del portapapeles</button>'+
    '<label class="l">O pégalo aquí a mano</label><textarea id="r-txt" rows="3" placeholder="{&quot;app&quot;:&quot;cuentas-claras&quot;…"></textarea><button class="btn sec" data-a="pastego">Juntar estos datos</button></div>');
  $('#r-file').onchange=importar;
}
function pegar(){
  if(navigator.clipboard&&navigator.clipboard.readText){navigator.clipboard.readText().then(recibirTexto).catch(function(){toast('Pégalo en el recuadro de abajo')})}
  else toast('Pégalo en el recuadro de abajo');
}
function recibirTexto(t){
  try{
    var j=JSON.parse(String(t).trim()); if(j.app!==APP||!j.datos)throw new Error('no son datos de Cuentas Claras');
    var r=merge(S,j.datos); save(); LS.set('cc_recv',stampNow()); closeSheet(); render();
    toast('📥 '+(j.de?j.de+': ':'')+r.nuevos+' nuevos · '+r.actualizados+' actualizados');
  }catch(e){toast('No válido: '+(e.message||e))}
}
function importar(ev){
  var fl=ev.target.files[0]; if(!fl)return;
  fl.text().then(recibirTexto).catch(function(e){toast('Archivo no válido: '+e.message)});
  ev.target.value='';
}
// ---------- aviso de nueva versión ----------
function vnum(v){return parseInt(String(v).replace(/\D/g,''),10)||0}
var lastCheck=0, skipV='';
function buscarVersion(manual){
  if(!manual&&(Date.now()-lastCheck<60000||location.protocol==='file:'))return;
  lastCheck=Date.now();
  if(manual)toast('Buscando actualizaciones…');
  fetch('./index.html?v='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error(r.status);return r.text()}).then(function(t){
    var m=t.match(/var VERSION='(v\d+)'/); if(!m)throw new Error('sin versión');
    var nueva=m[1];
    if(vnum(nueva)>vnum(VERSION)){ if(manual||skipV!==nueva)mostrarModal(nueva) }
    else if(manual)toast('✅ Ya tienes la última versión ('+VERSION+')');
  }).catch(function(){ if(manual)actualizar() });
}
function mostrarModal(nueva){
  $('#modal').innerHTML='<div class="mi">✨</div><b class="t">Nueva versión disponible</b><p>Tienes la <b>'+esc(VERSION)+'</b> y ya está lista la <b>'+esc(nueva)+'</b>.<br>Tus gastos no se tocan.</p>'+
    '<button class="btn" data-a="upd-now">Actualizar ahora</button><button class="btn sec" data-a="upd-later" data-v="'+esc(nueva)+'">Más tarde</button>';
  $('#ov2').classList.add('on'); $('#modal').classList.add('on');
}
function cerrarModal(){$('#ov2').classList.remove('on');$('#modal').classList.remove('on')}
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')buscarVersion(false)});
function actualizar(){
  toast('Buscando la última versión…');
  var p=[];
  if(navigator.serviceWorker)p.push(navigator.serviceWorker.getRegistrations().then(function(rs){return Promise.all(rs.map(function(r){return r.unregister()}))}));
  if(window.caches)p.push(caches.keys().then(function(ks){return Promise.all(ks.map(function(k){return caches.delete(k)}))}));
  Promise.all(p).then(function(){setTimeout(function(){location.replace(location.pathname+'?u='+Date.now())},300)});
}

// ---------- arranque ----------
function init(){
  applyTheme();
  dbOpen().then(function(){return dbGet('state')}).catch(function(){return null}).then(function(st){
    S=st||LS.get('cc_mirror',null)||seed();
    S.ajustes=S.ajustes||{id:'ajustes',u:0};
    if(!st)save();
    if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().then(function(p){persisted=p;if(view==='cfg')render()});
    render();
  });
}
init();
setTimeout(function(){buscarVersion(false)},1500);
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(function(){})}
</script>
