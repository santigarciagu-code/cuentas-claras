<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cuentas Claras</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png?v=2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cuentas">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<style>
:root{--bg:#ffffff;--soft:#f6f6f8;--card:#ffffff;--ink:#111114;--ink2:#3a3a42;--mut:#8a8a94;--line:#ececf0;--acc:#4f46e5;--acc2:#eef0ff;--acc3:#c7cbfb;--ok:#0f9d63;--okb:#eaf7f1;--bad:#d93d42;--badb:#fdf0f0;--warn:#9a6b10;--warnb:#fbf5e6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0b0d;--soft:#151518;--card:#0b0b0d;--ink:#f3f3f5;--ink2:#cfcfd6;--mut:#85858f;--line:#232328;--acc:#8b85ff;--acc2:#1b1a33;--acc3:#3b3878;--ok:#3ccf8e;--okb:#10241b;--bad:#ff7a7e;--badb:#2a1517;--warn:#e7b04f;--warnb:#2a2213}}
:root[data-theme="dark"]{--bg:#0b0b0d;--soft:#151518;--card:#0b0b0d;--ink:#f3f3f5;--ink2:#cfcfd6;--mut:#85858f;--line:#232328;--acc:#8b85ff;--acc2:#1b1a33;--acc3:#3b3878;--ok:#3ccf8e;--okb:#10241b;--bad:#ff7a7e;--badb:#2a1517;--warn:#e7b04f;--warnb:#2a2213}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior-y:none}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,sans-serif;padding:calc(env(safe-area-inset-top) + 6px) 20px calc(env(safe-area-inset-bottom) + 100px);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
.hide{display:none!important}
h1{font-size:28px;letter-spacing:-.025em;margin:14px 0 4px;font-weight:650}
h2{font-size:13px;color:var(--mut);margin:34px 0 10px;font-weight:500;letter-spacing:0}
.sub{color:var(--mut);font-size:13px}
.num{font-variant-numeric:tabular-nums}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:10px 0}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ver{font-size:11px;color:var(--mut)}
.icon{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;display:block}
/* inicio */
.mbar{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.mbar button{border:0;background:none;width:40px;height:40px;border-radius:50%;color:var(--ink2);display:flex;align-items:center;justify-content:center}
.mbar button:active{background:var(--soft)}
.mbar span{font-size:15px;font-weight:600;text-transform:capitalize}
.total{margin:26px 0 6px}
.total .lbl{font-size:14px;color:var(--mut)}
.total .big{font-size:52px;font-weight:650;letter-spacing:-.045em;line-height:1.05;margin-top:4px}
.total .big small{font-size:26px;font-weight:500;color:var(--mut);letter-spacing:-.02em;margin-left:6px}
.who{display:grid;grid-template-columns:1fr 1fr;margin-top:22px;border-top:1px solid var(--line)}
.who div{padding:14px 0 0}
.who div+div{padding-left:16px;border-left:1px solid var(--line)}
.who span{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--mut)}
.who b{display:block;font-size:24px;font-weight:600;letter-spacing:-.03em;margin-top:2px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.ratio{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--line);margin-top:16px;gap:2px}
.ratio i{display:block;height:100%}
.note{font-size:13px;color:var(--mut);margin-top:12px;line-height:1.5}
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl th{font-weight:500;color:var(--mut);font-size:13px;text-align:right;padding:0 0 8px}
.tbl th:first-child{text-align:left}
.tbl td+td,.tbl th+th{padding-left:14px}
.tbl td{padding:11px 0;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
.tbl td:first-child{text-align:left;color:var(--ink2);white-space:normal}
.tbl tr.tot td{font-weight:600;color:var(--ink)}
.tbl tr.acc td{color:var(--acc);font-weight:600}
.lnk{display:flex;align-items:center;gap:12px;width:100%;border:0;border-top:1px solid var(--line);background:none;padding:14px 0;text-align:left;font-size:15px}
.lnk:last-child{border-bottom:1px solid var(--line)}
.lnk .t{flex:1}.lnk small{display:block;color:var(--mut);font-size:12px}
.lnk .go{color:var(--mut)}
.lnk.a{color:var(--acc);font-weight:600}
/* listas */
.seg{display:flex;border-bottom:1px solid var(--line);gap:22px;margin:14px 0}
.seg button{border:0;background:none;padding:10px 0;font-weight:500;font-size:15px;color:var(--mut);border-bottom:2px solid transparent;margin-bottom:-1px}
.seg button.on{color:var(--ink);border-bottom-color:var(--ink)}
.grp{margin:8px 0 18px}
.grp .gh{display:flex;align-items:center;gap:8px;padding:10px 0 6px;font-weight:600;font-size:14px}
.grp .gh small{margin-left:auto;color:var(--mut);font-weight:500}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);width:100%;border-left:0;border-right:0;border-bottom:0;background:none;text-align:left}
.row:active{background:var(--soft)}
.ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;flex:none;background:var(--soft)!important}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:500;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t small{display:block;color:var(--mut);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .m{text-align:right}
.row .m b{display:block;font-size:15px;font-weight:500}
.row .m small{color:var(--mut);font-size:11px}
.off{opacity:.45}
.tag{display:inline-block;font-size:11px;font-weight:500;padding:1px 6px;border-radius:5px;margin-right:5px;vertical-align:1px;background:var(--soft)!important;color:var(--ink2)!important}
.search{width:100%;border:0;background:var(--soft);border-radius:12px;padding:11px 14px;font:inherit;font-size:16px;color:var(--ink)}
.empty{text-align:center;color:var(--mut);padding:34px 10px;font-size:14px}
.empty b{display:block;font-size:30px;margin-bottom:6px;font-weight:300}
/* nav */
nav{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:center;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--line);padding:6px 10px calc(env(safe-area-inset-bottom) + 6px);z-index:20}
nav button{flex:1;border:0;background:none;color:var(--mut);font-size:10.5px;font-weight:500;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button.on{color:var(--ink)}
nav .fab{flex:none;width:48px;height:48px;border-radius:50%;background:var(--acc);color:#fff;margin:0 8px;padding:0;justify-content:center}
nav .fab .icon{width:24px;height:24px;stroke-width:2}
/* hoja */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:40;opacity:0;transition:opacity .2s;pointer-events:none}
.ov.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--bg);border-radius:20px 20px 0 0;z-index:41;padding:8px 20px calc(env(safe-area-inset-bottom) + 20px);transform:translateY(105%);visibility:hidden;transition:transform .28s cubic-bezier(.2,.9,.3,1),visibility 0s .28s;-webkit-overflow-scrolling:touch}
.sheet.on{transform:none;visibility:visible;transition:transform .28s cubic-bezier(.2,.9,.3,1)}
.grab{width:36px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 8px}
.sh-top{display:flex;align-items:center;justify-content:space-between;position:sticky;top:-8px;background:var(--bg);padding:6px 0 8px;z-index:2}
.sh-top b{font-size:16px;font-weight:600}
.link{border:0;background:none;color:var(--acc);font-weight:500;font-size:16px;padding:6px 2px}
label.l{display:block;font-size:13px;color:var(--mut);margin:18px 0 7px;font-weight:500}
input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--soft);border:1px solid transparent;border-radius:12px;padding:12px 14px;-webkit-appearance:none;appearance:none}
input:focus,textarea:focus{outline:none;border-color:var(--acc);background:var(--bg)}
.amt{position:relative}
.amt input{font-size:40px;font-weight:600;letter-spacing:-.03em;padding:14px 50px 14px 16px;background:none;border:0;border-bottom:1px solid var(--line);border-radius:0;padding-left:0}
.amt input:focus{border-color:var(--acc)}
.amt span{position:absolute;right:4px;top:50%;transform:translateY(-50%);font-size:28px;color:var(--mut);font-weight:400}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:500}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.catg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.catg button{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 2px 8px;font-size:11.5px;font-weight:500;line-height:1.15;overflow-wrap:anywhere;color:var(--ink2)}
.catg button em{display:block;font-style:normal;font-size:20px;margin-bottom:4px}
.catg button.on{border-color:var(--ink);color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.split{border:1px solid var(--line);border-radius:14px;padding:14px}
.split .nm{display:flex;justify-content:space-between;font-weight:600;margin-bottom:10px;font-size:15px}
input[type=range]{padding:0;border:0;height:28px;background:none}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--ca) 0 var(--p),var(--cb) var(--p) 100%)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;border:1px solid rgba(0,0,0,.12);box-shadow:0 1px 4px rgba(0,0,0,.18);margin-top:-11px}
.btn{display:block;width:100%;border:0;background:var(--acc);color:#fff;font-weight:600;font-size:16px;border-radius:12px;padding:14px;margin-top:16px}
.btn.sec{background:var(--soft);color:var(--ink)}
.btn.del{background:none;color:var(--bad);border:1px solid var(--line)}
.btn:disabled{opacity:.4}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bar{padding:10px 0;font-size:13px;margin:6px 0;font-weight:500;border-radius:0}
.bar.ok{color:var(--ok)}.bar.warn{color:var(--warn)}.bar.err{color:var(--bad)}
.bar button{border:0;background:none;font-weight:600;color:var(--acc);padding:0;margin-left:4px}
.calc{font-size:13px;color:var(--mut);background:var(--soft);border-radius:12px;padding:10px 12px;margin-top:10px;line-height:1.5}
.calc b{color:var(--ink);font-weight:600}
.toggle{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:12px 0;margin-top:14px}
.sw{width:48px;height:28px;border-radius:14px;background:var(--line);border:0;position:relative;transition:.2s}
.sw:after{content:"";position:absolute;left:2px;top:2px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.2s}
.sw.on{background:var(--acc)}.sw.on:after{left:22px}
.colors{display:flex;gap:10px;flex-wrap:wrap}
.colors button{width:32px;height:32px;border-radius:50%;border:3px solid var(--bg);box-shadow:0 0 0 1px var(--line)}
.colors button.on{box-shadow:0 0 0 2px var(--ink)}
.emo{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.emo button{border:0;background:var(--soft);border-radius:10px;padding:6px 0;font-size:20px}
.emo button.on{box-shadow:inset 0 0 0 2px var(--ink)}
.av{width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:15px;flex:none}
/* informes */
.kpis{display:grid;grid-template-columns:1fr 1fr 1fr;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-top:8px}
.kpis div{padding:14px 0}
.kpis div+div{padding-left:12px;border-left:1px solid var(--line)}
.kpis span{display:block;font-size:12px;color:var(--mut);white-space:nowrap}
.kpis b{display:block;font-size:19px;font-weight:600;letter-spacing:-.025em;margin-top:2px;white-space:nowrap}
.hb{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:10px 0;border-top:1px solid var(--line);font-size:15px;align-items:baseline}
.hb:first-of-type{border-top:0}
.hb span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink2)}
.hb b{font-weight:500;text-align:right;white-space:nowrap}
.hb b small{color:var(--mut);font-weight:400;font-size:12px;margin-right:8px}
.hb i{grid-column:1/-1;display:block;height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.hb u{display:block;height:100%;border-radius:2px;background:var(--acc)}
.rank{color:var(--mut);font-variant-numeric:tabular-nums;margin-right:10px;font-size:13px}
.vb{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:18px;border-bottom:1px solid var(--line)}
.vb div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.vb u{display:block;width:100%;max-width:34px;border-radius:4px 4px 0 0;background:var(--acc3);min-height:2px}
.vb div.cur u{background:var(--acc)}
.vb small{font-size:11px;color:var(--ink2);margin-bottom:4px;white-space:nowrap}
.vbl{display:flex;gap:10px;margin-top:6px}
.vbl span{flex:1;text-align:center;font-size:12px;color:var(--mut)}
.vbl span.cur{color:var(--ink);font-weight:600}
.legend{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);margin-top:8px}
.legend b{color:var(--ink);font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 84px);transform:translateX(-50%) translateY(16px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:500;opacity:0;transition:.25s;z-index:60;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%)}
.sett .row{padding:13px 0}
.share{display:flex;align-items:center;gap:12px}
.share .t{flex:1;min-width:0}.share .t b{display:block;font-weight:600}.share .t small{color:var(--mut);font-size:12px}
.sbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.sbtns .btn{margin:0;padding:12px 8px;font-size:15px}
.tiles{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:14px 0 6px}
.tile{padding:12px 0}.tile+.tile{padding-left:14px;border-left:1px solid var(--line)}
.tile span{display:block;font-size:12px;color:var(--mut)}.tile b{display:block;font-size:20px;font-weight:600;letter-spacing:-.025em}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="v-home"></div>
<div id="v-gastos" class="hide"></div>
<div id="v-rep" class="hide"></div>
<div id="v-cfg" class="hide"></div>

<nav>
  <button data-v="home" class="on"><svg class="icon" viewBox="0 0 24 24"><path d="M3.5 10.5 12 4l8.5 6.5"/><path d="M5.5 9.5V20h13V9.5"/></svg>Inicio</button>
  <button data-v="gastos"><svg class="icon" viewBox="0 0 24 24"><path d="M9 6.5h11M9 12h11M9 17.5h11"/><path d="M4.5 6.5h.01M4.5 12h.01M4.5 17.5h.01" stroke-width="2.6"/></svg>Gastos</button>
  <button class="fab" data-a="new" aria-label="Nuevo gasto"><svg class="icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  <button data-v="rep"><svg class="icon" viewBox="0 0 24 24"><path d="M3 20.5h18"/><path d="M6.5 17V11M12 17V5.5M17.5 17v-4"/></svg>Informes</button>
  <button data-v="cfg"><svg class="icon" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>Ajustes</button>
</nav>
<div class="ov" id="ov" data-a="close"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
var VERSION='v6';
var APP='cuentas-claras';

// ---------- utilidades ----------
function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
var FMT=new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR',minimumFractionDigits:2,maximumFractionDigits:2});
var FMT0=new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR',maximumFractionDigits:0});
function eur(n){return FMT.format(Math.round((+n||0)*100)/100)}
function eur0(n){return FMT0.format(+n||0)}
function num(v){if(typeof v==='number')return v; v=String(v||'').trim().replace(/\s|€/g,''); if(v.indexOf(',')>=0)v=v.replace(/\./g,'').replace(',','.'); var n=parseFloat(v); return isFinite(n)?n:0}
function r2(n){return Math.round(n*100)/100}
function uid(){return (crypto&&crypto.randomUUID)?crypto.randomUUID():'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,9)}
function now(){return Date.now()}
var LS={get:function(k,d){try{var v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
var MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
var MES3=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function ymOf(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function today(){var d=new Date();return ymOf(d)+'-'+String(d.getDate()).padStart(2,'0')}
function ymAdd(ym,k){var p=ym.split('-');var d=new Date(+p[0],+p[1]-1+k,1);return ymOf(d)}
function ymName(ym){var p=ym.split('-');return MESES[+p[1]-1]+' '+p[0]}
function ymShort(ym){var p=ym.split('-');return MES3[+p[1]-1]}
function fechaBonita(iso){var p=String(iso||'').split('-');return p.length===3?(+p[2])+' '+MES3[+p[1]-1]:iso}
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(function(){t.classList.remove('on')},1900)}
function haptic(){try{navigator.vibrate&&navigator.vibrate(8)}catch(e){}}

// ---------- datos iniciales (app vacía: solo categorías de ejemplo) ----------
var PERIODOS=[[1,'Mensual'],[2,'Cada 2 meses'],[3,'Trimestral'],[6,'Semestral'],[12,'Anual']];
var COLORS=['#3b82f6','#e0559a','#8b5cf6','#10b981','#f59e0b','#ef4444','#06b6d4','#64748b','#84cc16','#f97316'];
var EMOJIS=['🏠','💡','💧','🔥','📶','🛡️','🚗','🏍️','⛽','🛒','🍽️','📺','🎵','☁️','❤️','💊','🐾','👶','🎓','✈️','🎁','👕','💇','🏋️','🧾','🏦','💳','🔧','🎉','📦','🧸','✨'];
function seed(){
  var u=-1; // u=-1: cualquier dato recibido de la pareja tiene prioridad sobre estos valores iniciales
  var P=[
    {id:'p1',nombre:'Persona 1',color:'#3b82f6',orden:1,u:u},
    {id:'p2',nombre:'Persona 2',color:'#e0559a',orden:2,u:u}
  ];
  var C=[
    {id:'c-hogar',nombre:'Hogar',emoji:'🏠',color:'#8b5cf6',reparto:50},
    {id:'c-sumin',nombre:'Suministros',emoji:'💡',color:'#f59e0b',reparto:50},
    {id:'c-seg',nombre:'Seguros',emoji:'🛡️',color:'#10b981',reparto:50},
    {id:'c-trans',nombre:'Coche y moto',emoji:'🚗',color:'#ef4444',reparto:50},
    {id:'c-subs',nombre:'Suscripciones',emoji:'📺',color:'#06b6d4',reparto:50},

function alive(a){return a.filter(function(x){return !x.del})}

function P(id){return S.personas.find(function(p){return p.id===id})}

function C(id){return S.categorias.find(function(c){return c.id===id})||{nombre:'Sin categoría',emoji:'🧾',color:'#64748b',reparto:50}}
function fijos(){return alive(S.gastos).filter(function(g){return g.tipo==='fijo'})}
function puntuales(ym){return alive(S.gastos).filter(function(g){return g.tipo==='puntual'&&(!ym||String(g.fecha).slice(0,7)===ym)})}
function comun(){return 'la cuenta común'}
function mensual(g){if(g.tipo!=='fijo'||g.activo===false)return 0; return (+g.importe||0)/Math.max(1,+g.periodo||1)}
function share(g,pid){
  var ps=pers(); if(g.titular==='comun'){var r=(g.reparto==null?50:+g.reparto)/100; return pid===ps[0].id?r:(1-r)}
  return g.titular===pid?1:0;
}
// Cada persona ingresa en la cuenta común: su parte de TODOS los gastos − lo que paga directamente desde su propia cuenta.
function calc(list,amountFn){
  var ps=pers(), out={total:0,enComun:0,cat:{},p:{}};
  ps.forEach(function(p){out.p[p.id]={parte:0,directo:0,aport:0,comunParte:0,propio:0}});
  list.forEach(function(g){
    var m=amountFn(g); if(!m)return;
    out.total+=m; if(g.desde==='comun')out.enComun+=m;
    out.cat[g.cat]=(out.cat[g.cat]||0)+m;
    ps.forEach(function(p){var s=share(g,p.id)*m; var o=out.p[p.id]; o.parte+=s; if(g.titular==='comun')o.comunParte+=s; else o.propio+=s; if(g.desde===p.id)o.directo+=m});
  });
  ps.forEach(function(p){var o=out.p[p.id];o.aport=o.parte-o.directo});
  return out;
}
function calcFijos(){return calc(fijos(),mensual)}
function calcPunt(ym){return calc(puntuales(ym),function(g){return +g.importe||0})}
function repTxt(g){var ps=pers(); if(g.titular!=='comun')return 'Solo '+(P(g.titular)||{}).nombre; var r=g.reparto==null?50:+g.reparto; return r===50?'Común 50/50':'Común '+r+'/'+(100-r)}

function perTxt(n){n=+n||1;var f=PERIODOS.find(function(x){return x[0]===n});return f?f[1]:'Cada '+n+' meses'}

function merge(A,B){
  var res={nuevos:0,actualizados:0};
  ['personas','categorias','gastos'].forEach(function(k){
    var map={}; A[k].forEach(function(x){map[x.id]=x});
    (B[k]||[]).forEach(function(x){if(!x||!x.id)return; var y=map[x.id]; if(!y){A[k].push(x);map[x.id]=x;if(!x.del)res.nuevos++} else if((x.u||0)>(y.u||0)){var i=A[k].indexOf(y);A[k][i]=x;res.actualizados++}});
  });

var CRCT=(function(){var t=[],c,n,k;for(n=0;n<256;n++){c=n;for(k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();

function zip(files){
  var enc=new TextEncoder(), parts=[], cen=[], off=0;
  function u16(v){return [v&255,(v>>>8)&255]} function u32(v){return [v&255,(v>>>8)&255,(v>>>16)&255,(v>>>24)&255]}
  files.forEach(function(f){
    var name=enc.encode(f[0]), data=enc.encode(f[1]), crc=crc32(data);
    var common=[].concat(u16(20),u16(0x0800),u16(0),u16(0),u16(0x21),u32(crc),u32(data.length),u32(data.length),u16(name.length),u16(0));
    var loc=new Uint8Array([].concat(u32(0x04034b50),common)); parts.push(loc,name,data);
    cen.push(new Uint8Array([].concat(u32(0x02014b50),u16(20),common,u16(0),u16(0),u16(0),u32(0),u32(off))),name);
    off+=loc.length+name.length+data.length;
  });
  var csize=cen.reduce(function(s,a){return s+a.length},0);
  var end=new Uint8Array([].concat(u32(0x06054b50),u16(0),u16(0),u16(files.length),u16(files.length),u32(csize),u32(off),u16(0)));
  return new Blob(parts.concat(cen,[end]),{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
function xe(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]}).replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g,'')}
function colL(i){var s='';i++;while(i){var m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=(i-m-1)/26}return s}
function xdate(iso){var p=String(iso).split('-');return (Date.UTC(+p[0],+p[1]-1,+p[2])-Date.UTC(1899,11,30))/864e5}
// estilos: 0 normal · 1 cabecera · 2 euros · 3 total texto · 4 total euros · 5 fecha · 6 porcentaje · 7 título
var XSTY='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><numFmts count="2"><numFmt numFmtId="164" formatCode="#,##0.00\\ &quot;€&quot;"/><numFmt numFmtId="165" formatCode="dd/mm/yyyy"/></numFmts>'+
 '<fonts count="4"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="15"/><color rgb="FF5B3DF0"/><name val="Calibri"/></font></fonts>'+
 '<fills count="4"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF6C4CF5"/></patternFill></fill><fill><patternFill patternType="solid"><fgColor rgb="FFEFEAFF"/></patternFill></fill></fills>'+
 '<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="8"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf fontId="1" fillId="2" applyFont="1" applyFill="1" numFmtId="0" borderId="0" xfId="0"/><xf numFmtId="164" applyNumberFormat="1" fontId="0" fillId="0" borderId="0" xfId="0"/><xf fontId="2" fillId="3" applyFont="1" applyFill="1" numFmtId="0" borderId="0" xfId="0"/><xf numFmtId="164" fontId="2" fillId="3" applyNumberFormat="1" applyFont="1" applyFill="1" borderId="0" xfId="0"/><xf numFmtId="165" applyNumberFormat="1" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="9" applyNumberFormat="1" fontId="0" fillId="0" borderId="0" xfId="0"/><xf fontId="3" applyFont="1" numFmtId="0" fillId="0" borderId="0" xfId="0"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>';
// celda: string, número, {v,s}, {f,s} (fórmula), {d:'AAAA-MM-DD'} o null
function xsheet(rows,widths,freeze){
  var x='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">';
  x+='<sheetViews><sheetView workbookViewId="0">'+(freeze?'<pane ySplit="'+freeze+'" topLeftCell="A'+(freeze+1)+'" activePane="bottomLeft" state="frozen"/>':'')+'</sheetView></sheetViews>';
  x+='<cols>'+widths.map(function(w,i){return '<col min="'+(i+1)+'" max="'+(i+1)+'" width="'+w+'" customWidth="1"/>'}).join('')+'</cols><sheetData>';
  rows.forEach(function(r,ri){
    x+='<row r="'+(ri+1)+'">';
    r.forEach(function(c,ci){
      if(c==null||c==='')return; var ref=colL(ci)+(ri+1), o=(typeof c==='object')?c:{v:c};
      var s=o.s?' s="'+o.s+'"':'';
      if(o.f!=null)x+='<c r="'+ref+'"'+s+'><f>'+xe(o.f)+'</f></c>';
      else if(o.d)x+='<c r="'+ref+'" s="5"><v>'+xdate(o.d)+'</v></c>';
      else if(typeof o.v==='number')x+='<c r="'+ref+'"'+s+'><v>'+(Math.round(o.v*10000)/10000)+'</v></c>';
      else x+='<c r="'+ref+'"'+s+' t="inlineStr"><is><t xml:space="preserve">'+xe(o.v)+'</t></is></c>';
    });
    x+='</row>';
  });
  return x+'</sheetData></worksheet>';
}
function xlsx(sheets){
  var f=[['[Content_Types].xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'+sheets.map(function(s,i){return '<Override PartName="/xl/worksheets/sheet'+(i+1)+'.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>'}).join('')+'</Types>'],
    ['_rels/.rels','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'],
    ['xl/workbook.xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>'+sheets.map(function(s,i){return '<sheet name="'+xe(s.name)+'" sheetId="'+(i+1)+'" r:id="rId'+(i+1)+'"/>'}).join('')+'</sheets><calcPr calcId="191029" fullCalcOnLoad="1"/></workbook>'],
    ['xl/_rels/workbook.xml.rels','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+sheets.map(function(s,i){return '<Relationship Id="rId'+(i+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet'+(i+1)+'.xml"/>'}).join('')+'<Relationship Id="rId'+(sheets.length+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>'],
    ['xl/styles.xml',XSTY]];
  sheets.forEach(function(s,i){f.push(['xl/worksheets/sheet'+(i+1)+'.xml',xsheet(s.rows,s.widths,s.freeze)])});
  return zip(f);
}
function H(a){return a.map(function(t){return {v:t,s:1}})}
function E(n){return {v:r2(n||0),s:2}}
function sumRow(label,cols,first,last,ncols){var r=[{v:label,s:3}];for(var i=1;i<ncols;i++)r.push(cols.indexOf(i)>=0?{f:'SUM('+colL(i)+first+':'+colL(i)+last+')',s:4}:{v:'',s:3});return r.map(function(c){return c.v===''?{v:' ',s:3}:c})}
function libroExcel(){
  var ps=pers(), A=ps[0], B=ps[1], nA=A.nombre, nB=B.nombre;
  var quien=function(g){return g.titular==='comun'?'Común':(P(g.titular)||{}).nombre};
  var cta=function(g){return g.desde==='comun'?'Cuenta común':(g.tipo==='fijo'?'Cuenta personal de ':'')+(P(g.desde)||{}).nombre};
  // 1. Resumen mensual
  var F=calcFijos(), ms=puntuales().map(function(g){return String(g.fecha).slice(0,7)}), hoy=ymOf(new Date());
  var desde=[hoy.slice(0,4)+'-01'].concat(ms).sort()[0], hasta=[hoy].concat(ms).sort().pop(), meses=[];
  for(var m=desde;m<=hasta;m=ymAdd(m,1))meses.push(m);
  var R=[[{v:'Cuentas Claras · resumen mensual',s:7}],['Exportado el '+new Date().toLocaleString('es-ES')],[],
    H(['Mes','Fijo '+nA,'Fijo '+nB,'Puntuales '+nA,'Puntuales '+nB,'Ingresa '+nA,'Ingresa '+nB,'Total a la cuenta común','Gasto puntual del mes'])];
  meses.forEach(function(m){var Pu=calcPunt(m), r=R.length+1;
    R.push([ymName(m).replace(/^./,function(c){return c.toUpperCase()}),E(F.p[A.id].aport),E(F.p[B.id].aport),E(Pu.p[A.id].aport),E(Pu.p[B.id].aport),{f:'B'+r+'+D'+r,s:2},{f:'C'+r+'+E'+r,s:2},{f:'F'+r+'+G'+r,s:2},E(Pu.total)])});
  R.push(sumRow('Total',[1,2,3,4,5,6,7,8],5,R.length,9));
  // 2. Gastos fijos
  var fx=fijos().slice().sort(function(a,b){return C(a.cat).orden-C(b.cat).orden||mensual(b)-mensual(a)});
  var Fx=[H(['Concepto','Categoría','De quién','% '+nA,'% '+nB,'Importe','Cada (meses)','Al mes','Al año','Parte '+nA+'/mes','Parte '+nB+'/mes','Se paga desde','Activo','Notas'])];
  fx.forEach(function(g){var r=Fx.length+1, on=g.activo!==false, sa=share(g,A.id), sb=share(g,B.id);
    Fx.push([g.concepto,C(g.cat).nombre,quien(g),{v:sa,s:6},{v:sb,s:6},E(g.importe),+g.periodo||1,on?{f:'F'+r+'/G'+r,s:2}:E(0),{f:'H'+r+'*12',s:2},{f:'H'+r+'*D'+r,s:2},{f:'H'+r+'*E'+r,s:2},cta(g),on?'Sí':'No (pausado)',g.notas||''])});
  Fx.push(sumRow('Total',[7,8,9,10],2,Fx.length,14));
  // 3. Gastos puntuales
  var pu=puntuales().slice().sort(function(a,b){return String(a.fecha).localeCompare(b.fecha)});
  var Px=[H(['Fecha','Concepto','Categoría','Importe','De quién','% '+nA,'% '+nB,'Parte '+nA,'Parte '+nB,'Pagado por','Notas'])];
  pu.forEach(function(g){var r=Px.length+1;
    Px.push([{d:g.fecha},g.concepto,C(g.cat).nombre,E(g.importe),quien(g),{v:share(g,A.id),s:6},{v:share(g,B.id),s:6},{f:'D'+r+'*F'+r,s:2},{f:'D'+r+'*G'+r,s:2},g.desde==='comun'?'Cuenta común':(P(g.desde)||{}).nombre,g.notas||''])});
  if(pu.length)Px.push(sumRow('Total',[3,7,8],2,Px.length,11)); else Px.push(['Todavía no hay gastos puntuales']);
  // 4. Por categoría
  var Cx=[H(['Categoría','Fijos al mes','Fijos al año','Puntuales (total)','Reparto por defecto '+nA])];
  cats().forEach(function(c){var r=Cx.length+1, pt=puntuales().filter(function(g){return g.cat===c.id}).reduce(function(s,g){return s+(+g.importe||0)},0);
    Cx.push([c.nombre,E(F.cat[c.id]||0),{f:'B'+r+'*12',s:2},E(pt),{v:(c.reparto==null?50:c.reparto)/100,s:6}])});
  Cx.push(sumRow('Total',[1,2,3],2,Cx.length,5));
  return xlsx([
    {name:'Resumen mensual',rows:R,widths:[18,14,14,16,16,14,14,22,20],freeze:4},
    {name:'Gastos fijos',rows:Fx,widths:[26,16,12,9,9,12,12,12,12,15,15,24,12,30],freeze:1},
    {name:'Gastos puntuales',rows:Px,widths:[12,26,16,12,12,9,9,12,12,16,30],freeze:1},
    {name:'Por categoría',rows:Cx,widths:[20,14,14,18,22],freeze:1}
  ]);
}
function exportarExcel(){
  var blob;
  try{blob=libroExcel()}catch(e){toast('No se pudo crear el Excel: '+e.message);return}
  var file=new File([blob],'cuentas-claras-'+today()+'.xlsx',{type:blob.type});
  function done(){toast('📊 Excel listo')}
  if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:'Cuentas Claras en Excel'}).then(done).catch(function(){})}
  else{var a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=file.name;document.body.appendChild(a);a.click();a.remove();done()}
}
function excelCard(){return '<div><button class="lnk a" data-a="xlsx">'+ico('down')+'<span class="t">Crear archivo Excel<small>Resumen mensual, gastos fijos, puntuales y categorías</small></span><span class="go">'+ico('chev')+'</span></button></div>'}
function otra(){var m=me();var o=pers().filter(function(p){return p.id!==m});return m&&o.length?o[0]:null}
function shareCard(full){
  var o=otra(), nm=o?esc(o.nombre):'tu pareja', yo=P(me()), sent=LS.get('cc_sent',''), recv=LS.get('cc_recv','');
  var h='<div><button class="lnk" data-a="send">'+ico('send')+'<span class="t">Enviar mis datos a '+nm+'<small>'+(sent?'Último envío: '+esc(sent):'Por WhatsApp, AirDrop o Mensajes')+'</small></span><span class="go">'+ico('chev')+'</span></button>'+
    '<button class="lnk" data-a="recv">'+ico('recv')+'<span class="t">Recibir sus datos<small>'+(recv?'Última vez: '+esc(recv):'Elige el archivo o pega el texto')+'</small></span><span class="go">'+ico('chev')+'</span></button>'+
    '<button class="lnk" data-a="sendtxt"><span class="t" style="padding-left:34px">Copiar mis datos como texto<small>Para pegarlos en un chat</small></span></button></div>';
  if(full)h+='<div class="note">Se juntan los gastos de los dos sin duplicar nada; si los dos habéis editado el mismo gasto, gana el cambio más reciente. Los datos solo salen del móvil por la app que elijas para enviarlos.</div>';
  if(!yo&&full)h+='<div class="bar warn">Elige arriba quién usa este móvil para que el envío lleve tu nombre.</div>';
  return h;
}
function payload(){var yo=P(me());return JSON.stringify({app:APP,version:1,de:yo?yo.nombre:'',exportado:new Date().toISOString(),datos:S})}
function stampNow(){return new Date().toLocaleString('es-ES',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}
function enviarPareja(){
  var yo=P(me()), file=new File([payload()],'cuentas-claras'+(yo?'-de-'+yo.nombre.toLowerCase().replace(/[^a-z0-9áéíóúñ]+/g,'-'):'')+'-'+today()+'.json',{type:'application/json'});
  function done(){LS.set('cc_sent',stampNow());render();toast('📤 Datos enviados')}
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    navigator.share({files:[file],title:'Gastos de Cuentas Claras'}).then(done).catch(function(e){if(e&&e.name!=='AbortError')copiarTexto()});
  } else copiarTexto();
}
function copiarTexto(){
  var t=payload();
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){LS.set('cc_sent',stampNow());render();toast('📋 Copiado: pégalo en WhatsApp')}).catch(function(){toast('No se pudo copiar')})}
  else toast('Tu navegador no permite copiar');
}
function abrirRecibir(){
  var o=otra(), nm=o?esc(o.nombre):'tu pareja';
  edKind='recv';
  openSheet('<div class="sh-top"><button class="link" data-a="close">Cerrar</button><b>Recibir datos</b><span style="width:60px"></span></div>'+
    '<div class="card"><b>Si te ha llegado un archivo</b><div class="sub" style="margin:4px 0 0">En WhatsApp: abre el archivo → Compartir → <b>Guardar en Archivos</b>. Con AirDrop se guarda solo en Descargas. Luego elígelo aquí:</div>'+
    '<label class="btn" style="text-align:center">Elegir archivo de '+nm+'<input type="file" id="r-file" accept="application/json,.json,text/plain" style="display:none"></label></div>'+
    '<div class="card"><b>Si te ha llegado como texto</b><div class="sub" style="margin:4px 0 0">Mantén pulsado el mensaje → Copiar, y toca:</div>'+
    '<button class="btn sec" data-a="paste">Pegar del portapapeles</button>'+
    '<label class="l">O pégalo aquí a mano</label><textarea id="r-txt" rows="3" placeholder="{&quot;app&quot;:&quot;cuentas-claras&quot;…"></textarea><button class="btn sec" data-a="pastego">Juntar estos datos</button></div>');
  $('#r-file').onchange=importar;
}
function pegar(){
  if(navigator.clipboard&&navigator.clipboard.readText){navigator.clipboard.readText().then(recibirTexto).catch(function(){toast('Pégalo en el recuadro de abajo')})}
  else toast('Pégalo en el recuadro de abajo');
}
function recibirTexto(t){
  try{
    var j=JSON.parse(String(t).trim()); if(j.app!==APP||!j.datos)throw new Error('no son datos de Cuentas Claras');
    var r=merge(S,j.datos); save(); LS.set('cc_recv',stampNow()); closeSheet(); render();
    toast('📥 '+(j.de?j.de+': ':'')+r.nuevos+' nuevos · '+r.actualizados+' actualizados');
  }catch(e){toast('No válido: '+(e.message||e))}
}
function importar(ev){
  var fl=ev.target.files[0]; if(!fl)return;
  fl.text().then(recibirTexto).catch(function(e){toast('Archivo no válido: '+e.message)});
  ev.target.value='';
}
function actualizar(){
  toast('Buscando la última versión…');
  var p=[];
  if(navigator.serviceWorker)p.push(navigator.serviceWorker.getRegistrations().then(function(rs){return Promise.all(rs.map(function(r){return r.unregister()}))}));
  if(window.caches)p.push(caches.keys().then(function(ks){return Promise.all(ks.map(function(k){return caches.delete(k)}))}));
  Promise.all(p).then(function(){setTimeout(function(){location.replace(location.pathname+'?u='+Date.now())},300)});
}

    if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().then(function(p){persisted=p;if(view==='cfg')render()});
    render();
  });
}
init();
